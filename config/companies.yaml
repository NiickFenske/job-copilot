# --- NEEDS A QUICK MANUAL CHECK before fully trusting - unusual capitalization
# or a name mismatch worth confirming in a browser first. If wrong, "npm run
# fetch" just logs 0 jobs/an error for that one entry - low risk either way.
- name: "Smile.io"
  ats: lever
  slug: "Smile"           # capital S is unusual for Lever - verify jobs.lever.co/Smile loads real jobs
- name: "Privy"
  ats: workable
  slug: "privy-2"          # the "-2" suggests "privy" was taken by another account - verify
- name: "Nango"
  ats: ashby
  slug: "Nango"            # capital N is unusual for Ashby - verify jobs.ashbyhq.com/Nango loads real jobs
- name: "Hotjar"
  ats: lever
  slug: "contentsquare"    # plausible (Hotjar merged with Contentsquare) but worth a quick check

