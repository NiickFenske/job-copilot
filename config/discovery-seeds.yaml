# Seed list for "npm run discover" - real company names + their website domain.
# The discovery script checks each domain's careers page for signs of a known
# ATS (Greenhouse/Lever/Ashby/Workable/Recruitee) and reports matches for you
# to review and promote into companies.yaml. It does NOT guess ATS slugs -
# only reports what it actually finds on the live page.
#
# Add more rows yourself any time - just company name + bare domain (no
# https://, no /careers). Good sources for more names: Shopify's App Store
# (apps.shopify.com) browsed by category, and Shopify's Partner/Experts
# directory (experts.shopify.com) for agencies - both are public directories
# meant for browsing, so copying names/domains you find there into this file
# is completely fine; this file just holds names, not scraped data.

